version: '3.8'

services:
  # -----------------------------------------------------------------
  # VueCoin Application (Express API + 24/7 Arbitrage Worker + Vue SPA)
  # -----------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vuecoin-app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-vuecoin_secure_pass}
      - TELEGRAM_BOT_TOKEN_1=${TELEGRAM_BOT_TOKEN_1}
      - TELEGRAM_CHAT_ID_GENERAL=${TELEGRAM_CHAT_ID_GENERAL}
      - TELEGRAM_BOT_TOKEN_AZELERT=${TELEGRAM_BOT_TOKEN_AZELERT}
      - TELEGRAM_CHAT_ID_AZELERT=${TELEGRAM_CHAT_ID_AZELERT}
      - ADMIN_KEY=${ADMIN_KEY:-vuecoin_admin_secret}
    env_file:
      - path: server/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vuecoin-net

  # -----------------------------------------------------------------
  # In-Memory Cache & Message Broker (Redis 7)
  # -----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vuecoin-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-vuecoin_secure_pass}"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-vuecoin_secure_pass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - vuecoin-net

volumes:
  redis_data:
    driver: local

networks:
  vuecoin-net:
    driver: bridge
